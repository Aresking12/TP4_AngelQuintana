<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API de Países</title>
    <link rel="stylesheet" href="/statics/styles.css">
</head>
<body>
    <nav>
        <a href="index.html"><button>⬅️ Inicio</button></a>
    </nav>
    <header>
        <h2>Datos de Países 🌎</h2>
        <p>Datos proporcionados por REST Countries.</p>
    </header>

    <main>
        <section class="formulario-api">
            <label for="pais">Ingresa el nombre de un país:</label>
            <input type="text" id="pais" placeholder="Ej: Argentina">
            <button onclick="buscarPais()">Buscar País</button>
        </section>

        <section id="resultado-pais" class="resultados-api">
            <h3 id="nombre-pais"></h3>
            <p><strong>Capital:</strong> <span id="capital-pais"></span></p>
            <p><strong>Población:</strong> <span id="poblacion-pais"></span></p>
            <div id="bandera-pais-cont">
                <strong>Bandera:</strong>
                <img id="bandera-pais" src="" alt="Bandera del país">
            </div>
        </section>
    </main>

    <script src="/js/paises.js"></script>
</body>
</html>
